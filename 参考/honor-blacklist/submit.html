<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曝光违规 - 王者曝光台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-layer"><div class="bg-particles" id="particles"></div></div>

<!-- 导航 -->
<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" fill="#FFE6F0"/>
        <path d="M20 30 C12 24 8 18 12 13 C16 9 20 14 20 14 C20 14 24 9 28 13 C32 18 28 24 20 30Z" fill="#FFBED5"/>
        <circle cx="15" cy="14" r="2" fill="#FFFAFD" opacity="0.8"/>
      </svg>
      王者曝光台
    </a>
    <div class="nav-links-wrap">
      <ul class="nav-links" id="navLinks">
        <a href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span>查询</span>
        </a>
        <a href="submit.html" class="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>曝光</span>
        </a>
        <a href="blacklist.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>黑ID</span>
        </a>
        <a href="messages.html" id="navMsgLink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>私信</span>
          <span class="nav-badge" id="navMsgBadge" style="display:none;">0</span>
        </a>
        <div class="nav-user-pill" id="navUserPill">
          <button class="nav-user-btn" id="navUserBtn" onclick="handleUserPill()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span id="navUserText">登录</span>
          </button>
        </div>
        <div class="nav-admin-pill" id="navAdminPill" style="display:none;">
          <button class="nav-admin-btn" id="navAdminBtn" onclick="window.location.href='admin.html'">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>管理后台</span>
          </button>
        </div>
      </ul>
    </div>
  </div>
</nav>

<!-- page-content -->
<main class="page">
  <div class="page-content">
    <div class="container container-sm form-page">

      <div class="form-card glass-card" style="animation: fadeInUp 0.5s var(--ease-spring);">

        <!-- 用户登录状态栏 -->
        <div class="user-status-bar" id="userStatusBar">
          <div class="user-status-left" id="userStatusLeft">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:var(--gray-400);">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <span id="userStatusText" style="font-size:0.82rem;color:var(--gray-500);">
              当前为游客身份，<a href="javascript:void(0)" onclick="openUserModal()" style="color:var(--yellow-500);text-decoration:none;font-weight:500;cursor:pointer;">登录</a>后可查看提交记录
            </span>
          </div>
        </div>

        <h1 class="form-title">曝光骗子 / 被蹲</h1>
        <p class="form-subtitle">请如实填写信息，帮助更多人避雷 · 审核通过后将公开显示</p>

        <!-- 草稿提示条 -->
        <div class="draft-banner" id="draftBanner" style="display:none;">
          <div class="draft-banner-left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span id="draftBannerText">检测到未提交的草稿</span>
          </div>
          <div class="draft-banner-right">
            <button class="btn-draft-load" id="draftLoadBtn" type="button" onclick="loadDraft()">
              恢复草稿
            </button>
            <button class="btn-draft-clear" type="button" onclick="clearDraft()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

        <form id="submitForm" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label class="input-label">游戏ID / 角色名 *</label>
            <input type="text" class="input" id="gameId" placeholder="如：小明很厉害123"
              required maxlength="20" autocomplete="off">
          </div>

          <div class="form-group">
            <label class="input-label">你的昵称（选填）</label>
            <input type="text" class="input" id="name" placeholder="方便审核员联系你" maxlength="20" autocomplete="off">
          </div>

          <div class="form-group">
            <label class="input-label">王者荣耀世界ID（选填）</label>
            <input type="text" class="input" id="honorWorldId" placeholder="如：初恋、小明123，用于证明举报真实性" maxlength="30" autocomplete="off">
          </div>

          <div class="form-group">
            <label class="input-label">曝光类型 *</label>
            <select class="select" id="category" required onchange="updateReasons()">
              <option value="">请选择曝光类型</option>
              <option>正常交易被蹲</option>
              <option>卖家是骗子</option>
              <option>情感诈骗</option>
              <option>骗钱骗物</option>
              <option>恶意放鸽子</option>
              <option>恶意陪玩</option>
              <option>争议举报</option>
              <option>其他</option>
            </select>
          </div>

          <div class="form-group">
            <label class="input-label">曝光原因摘要 *</label>
            <input type="text" class="input" id="reason" placeholder="一句话概括曝光原因" required maxlength="50" autocomplete="off">
            <p class="form-hint" id="reasonHint">请选择曝光类型后查看提示</p>
          </div>

          <div class="form-group">
            <label class="input-label">详细经过 *</label>
            <textarea class="textarea" id="description"
              placeholder="请详细描述经过，包括：时间、王者荣耀世界/QQ/微信、具体发生了什么，越详细越容易被审核通过"
              required minlength="10" maxlength="500"></textarea>
            <p class="form-hint" id="descCount">0 / 500</p>
          </div>

          <div class="form-group">
            <label class="input-label" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
              <input type="checkbox" id="isAnonymous" style="width:16px;height:16px;accent-color:var(--yellow-500);cursor:pointer;">
              <span>匿名举报</span>
              <span style="font-size:0.72rem;color:var(--gray-400);font-weight:400;margin-left:2px;">（管理员仍可看到你的用户ID，其他用户看不到）</span>
            </label>
          </div>

          <div class="form-group">
            <label class="input-label">证据截图（选填，支持拖拽排序）</label>
            <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
              <svg viewBox="0 0 24 24" fill="none" stroke="#E88AAA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="fill:rgba(255,214,231,0.15);">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" fill="rgba(255,214,231,0.2)"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>
              <p>点击或拖拽上传截图</p>
              <p class="upload-tip">支持 JPG、PNG，长按拖动可调整顺序，点击图片可备注或编辑</p>
            </div>
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none" onchange="handleFiles(this.files)">
            <div class="upload-preview" id="uploadPreview"></div>
          </div>

          <div style="display:flex;gap:10px;align-items:center;">
            <button type="button" class="btn btn-ghost btn-sm" id="saveDraftBtn" onclick="saveDraft()" style="flex-shrink:0;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              保存草稿
            </button>
            <button type="submit" class="btn btn-submit-full" id="submitBtn" style="flex:1;margin-top:0;">
              提交曝光
            </button>
          </div>

          <p style="font-size:0.78rem;color:var(--gray-400);text-align:center;margin-top:16px;">
            提交即表示同意社区规范，恶意虚假曝光将被追究责任
          </p>
        </form>
      </div>

    </div>
  </div>
</main>
<!-- /page-content -->

<!-- 图片查看/编辑模态框 -->
<!-- 图片查看器 - 白色居中弹窗 -->
<div class="modal-overlay img-viewer-overlay" id="imgModal" onclick="closeImgModal()">
  <div class="modal img-viewer-card" onclick="event.stopPropagation()">
    <!-- 工具栏 -->
    <div class="img-viewer-bar">
      <span class="img-viewer-seq" id="imgModalSeq">1 / 3</span>
      <div class="img-viewer-tools">
        <button class="img-viewer-btn" onclick="imgModalPrev()" id="imgPrevBtn" title="上一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="img-viewer-btn" onclick="imgModalNext()" id="imgNextBtn" title="下一张">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="img-viewer-divider"></div>
        <button class="img-viewer-btn" onclick="toggleImgNote()" id="noteBtn" title="备注">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="img-viewer-btn" onclick="openImgEdit()" title="编辑打码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <div class="img-viewer-divider"></div>
        <button class="img-viewer-btn img-viewer-danger" onclick="imgModalDelete()" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>
    </div>

    <!-- 图片显示区 -->
    <div class="img-viewer-body" id="imgModalBody">
      <img id="imgModalMain" src="" alt="" class="img-viewer-img">
    </div>

    <!-- 备注区域 -->
    <div class="img-note-area" id="imgNoteArea" style="display:none;">
      <div class="img-note-input-row">
        <input type="text" class="input img-note-input" id="imgNoteText" placeholder="为此图片添加备注，例如：对方QQ号截图" maxlength="100">
        <button class="btn btn-primary btn-sm" onclick="saveImgNote()">保存</button>
      </div>
      <p class="img-note-hint" id="imgNoteCount">0 / 100</p>
    </div>

    <!-- 底部缩略图 -->
    <div class="img-viewer-thumbs" id="imgModalThumbs"></div>
  </div>
</div>

<!-- 图片打码编辑弹窗 -->
<div class="modal-overlay" id="imgEditModal" onclick="closeImgEdit()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span class="modal-title">图片编辑</span>
    </div>
    <div class="img-edit-wrap" id="imgEditWrap">
      <canvas id="imgEditCanvas"></canvas>
    </div>
    <div class="img-edit-bar">
      <button class="img-edit-btn active" id="brushBtn" onclick="setEditMode('brush')" title="画笔">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        画笔
      </button>
      <button class="img-edit-btn" id="blurBtn" onclick="setEditMode('blur')" title="模糊打码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        马赛克
      </button>
      <button class="img-edit-btn" id="undoBtn" onclick="imgUndo()" title="撤销">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.6"/></svg>
        撤销
      </button>
      <div class="img-edit-bar-right">
        <div class="img-brush-size-wrap" id="imgEditTools" style="display:none;">
          <span style="font-size:0.74rem;color:var(--gray-400);">笔触</span>
          <input type="range" class="img-brush-range" id="brushSizeRange" min="4" max="40" value="12" oninput="updateBrushSize(this.value)">
        </div>
      </div>
    </div>
    <div class="modal-actions" style="margin-top:12px;">
      <button class="btn btn-ghost btn-sm" onclick="closeImgEdit()">取消</button>
      <button class="btn btn-primary btn-sm" onclick="saveImgEdit()">保存</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script>
  let uploadedFiles = []; // [{src, note}]
  let currentImgIdx = 0;
  let editCtx = null;
  let editHistory = [];
  let editMode = 'brush';
  let editCanvasImg = null;
  /* ---- 弹窗缩略图拖拽排序 ---- */
  let thumbDragSrcIdx = -1;

  /* ==================== 用户状态 ==================== */
  function updateUserStatus() {
    const left = document.getElementById('userStatusLeft');
    if (!left) return;
    const user = SESSION.getCurrent();
    if (user) {
      left.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:var(--green-500);">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span style="font-size:0.82rem;color:var(--gray-600);">
          已登录：<strong style="color:var(--gray-800);font-weight:600;">${escapeHtml(user.username)}</strong>
          <a href="javascript:void(0)" onclick="handleUserPill()" style="color:var(--gray-400);text-decoration:none;margin-left:8px;font-size:0.78rem;">退出</a>
        </span>`;
      // 自动填充昵称
      const nameInput = document.getElementById('name');
      if (!nameInput.value) nameInput.value = user.username;
    } else {
      left.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;color:var(--gray-400);">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span style="font-size:0.82rem;color:var(--gray-500);">
          当前为游客身份，<a href="javascript:void(0)" onclick="openUserModal()" style="color:var(--yellow-500);text-decoration:none;font-weight:500;cursor:pointer;">登录</a>后可查看提交记录
        </span>`;
    }
  }

  /* ==================== 草稿功能 ==================== */
  function checkDraft() {
    const draft = DB.getDraft();
    if (draft) {
      const savedTime = new Date(draft.savedAt);
      const timeStr = savedTime.toLocaleDateString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
      document.getElementById('draftBannerText').textContent = `检测到草稿（${timeStr}）`;
      document.getElementById('draftBanner').style.display = 'flex';
    }
  }

  function loadDraft() {
    const draft = DB.getDraft();
    if (!draft) return;
    document.getElementById('gameId').value = draft.gameId || '';
    document.getElementById('name').value = draft.name || '';
    document.getElementById('category').value = draft.category || '';
    updateReasons();
    document.getElementById('reason').value = draft.reason || '';
    document.getElementById('description').value = draft.description || '';
    document.getElementById('descCount').textContent = `${(draft.description || '').length} / 500`;
    uploadedFiles = (draft.evidence || []).map(e => typeof e === 'string' ? { src: e, note: '' } : e);
    renderPreviews();
    DB.clearDraft();
    document.getElementById('draftBanner').style.display = 'none';
    showToast('草稿已恢复，可继续编辑', 'success', 2000);
  }

  function clearDraft() {
    DB.clearDraft();
    document.getElementById('draftBanner').style.display = 'none';
    showToast('草稿已清除', 'info', 1500);
  }

  function saveDraft() {
    const gameId = document.getElementById('gameId').value.trim();
    const name = document.getElementById('name').value.trim();
    const category = document.getElementById('category').value;
    const reason = document.getElementById('reason').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!gameId && !reason && !description) {
      showToast('请先填写内容再保存草稿', 'error', 2000);
      return;
    }

    DB.saveDraft({
      gameId, name, category, reason, description,
      evidence: uploadedFiles.map(f => ({ src: f.src, note: f.note })),
    });

    document.getElementById('draftBanner').style.display = 'none';
    showToast('草稿已保存，下次打开自动提示恢复', 'success', 2500);
  }

  function handleFiles(files) {
    Array.from(files).forEach(file => {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = e => {
        uploadedFiles.push({ src: e.target.result, note: '' });
        renderPreviews();
      };
      reader.readAsDataURL(file);
    });
  }

  function renderPreviews() {
    const container = document.getElementById('uploadPreview');
    if (uploadedFiles.length === 0) {
      container.innerHTML = '';
      container.style.display = 'none';
      return;
    }
    container.style.display = 'block';
    const html = `
      <div class="up-row" id="upRow">
        ${uploadedFiles.map((f, i) => `
          <div class="up-item ${i === 0 ? 'up-item-first' : ''}" data-idx="${i}"
               draggable="true"
               ontouchstart="touchDragStart(event,${i})"
               ontouchmove="touchDragMove(event)"
               ontouchend="touchDragEnd(event)"
               ondragstart="dragStart(event,${i})"
               ondragover="dragOver(event)"
               ondrop="dragDrop(event,${i})"
               ondragend="dragEnd(event)">
            <img src="${f.src}" alt="证据${i + 1}" data-img-idx="${i}">
            ${f.note ? `<div class="up-note-tag">${f.note.length > 8 ? f.note.slice(0,8)+'…' : f.note}</div>` : ''}
          </div>
        `).join('')}
      </div>
    `;
    container.innerHTML = html;
    // 绑定点击事件（点击整个缩略图容器打开）
    container.querySelectorAll('.up-item').forEach(item => {
      item.addEventListener('click', function(e) {
        const idx = parseInt(this.getAttribute('data-idx'));
        openImgModal(idx);
      });
    });
    container.querySelectorAll('.up-note-tag').forEach(tag => {
      tag.addEventListener('click', function(e) {
        e.stopPropagation();
        const idx = parseInt(this.closest('.up-item').getAttribute('data-idx'));
        openImgModal(idx);
        setTimeout(openImgNote, 100);
      });
    });
  }

  /* ==================== 拖拽排序（PC） ==================== */
  let dragSrcIdx = -1;
  function dragStart(e, idx) {
    dragSrcIdx = idx;
    e.dataTransfer.effectAllowed = 'move';
    e.target.closest('.up-item').style.opacity = '0.4';
  }
  function dragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
  function dragDrop(e, targetIdx) {
    e.preventDefault();
    if (dragSrcIdx !== -1 && dragSrcIdx !== targetIdx) {
      const item = uploadedFiles.splice(dragSrcIdx, 1)[0];
      uploadedFiles.splice(targetIdx, 0, item);
      renderPreviews();
    }
  }
  function dragEnd(e) {
    dragSrcIdx = -1;
    touchDrag.srcIdx = -1;
    touchDrag.moved = false;
    document.querySelectorAll('.up-item').forEach(el => el.style.opacity = '');

  /* ==================== 触摸拖拽排序（移动端） ==================== */
  let touchDrag = { srcIdx: -1, clone: null, startX: 0, startY: 0, moved: false };
  function touchDragStart(e, idx) {
    const touch = e.touches[0];
    touchDrag.srcIdx = idx;
    touchDrag.startX = touch.clientX;
    touchDrag.startY = touch.clientY;
    touchDrag.moved = false;
  }
  function touchDragMove(e) {
    if (touchDrag.srcIdx === -1) return;
    e.preventDefault();
    const touch = e.touches[0];
    const dist = Math.sqrt(Math.pow(touch.clientX - touchDrag.startX, 2) + Math.pow(touch.clientY - touchDrag.startY, 2));

    // 移动超过10px才真正开始拖拽
    if (dist > 10 && !touchDrag.moved) {
      touchDrag.moved = true;
      const item = e.target.closest('.up-item');
      touchDrag.clone = item.cloneNode(true);
      touchDrag.clone.style.cssText = `position:fixed;pointer-events:none;z-index:9999;opacity:0.7;transform:scale(1.05);width:${item.offsetWidth}px;height:${item.offsetHeight}px;left:${touch.clientX - item.offsetWidth/2}px;top:${touch.clientY - 20}px;transition:none;`;
      document.body.appendChild(touchDrag.clone);
      item.style.opacity = '0.3';
    }

    if (touchDrag.clone) {
      touchDrag.clone.style.left = (touch.clientX - touchDrag.clone.offsetWidth / 2) + 'px';
      touchDrag.clone.style.top = (touch.clientY - 20) + 'px';
    }

    const items = document.querySelectorAll('.up-item');
    items.forEach(item => item.classList.remove('drag-over'));
    for (const item of items) {
      const rect = item.getBoundingClientRect();
      if (touch.clientX > rect.left && touch.clientX < rect.right && touch.clientY > rect.top && touch.clientY < rect.bottom) {
        item.classList.add('drag-over');
        break;
      }
    }
  }
  function touchDragEnd(e) {
    if (touchDrag.srcIdx === -1) return;

    // 如果没有真正移动超过10px，当作点击处理
    if (!touchDrag.moved) {
      const idx = touchDrag.srcIdx;
      touchDrag.srcIdx = -1;
      openImgModal(idx);
      return;
    }

    const items = document.querySelectorAll('.up-item');
    let targetIdx = touchDrag.srcIdx;
    if (touchDrag.clone) {
      const items2 = Array.from(items);
      for (let i = 0; i < items2.length; i++) {
        const rect = items2[i].getBoundingClientRect();
        if (touchDrag.clone.offsetLeft + touchDrag.clone.offsetWidth / 2 > rect.left && touchDrag.clone.offsetLeft + touchDrag.clone.offsetWidth / 2 < rect.right) {
          targetIdx = i;
          break;
        }
      }
    }
    if (touchDrag.srcIdx !== targetIdx) {
      const item = uploadedFiles.splice(touchDrag.srcIdx, 1)[0];
      uploadedFiles.splice(targetIdx, 0, item);
    }
    if (touchDrag.clone) { touchDrag.clone.remove(); touchDrag.clone = null; }
    items.forEach(item => { item.style.opacity = ''; item.classList.remove('drag-over'); });
    touchDrag.srcIdx = -1;
    renderPreviews();
  }

  // Canvas 绘画逻辑
  document.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('imgEditCanvas');
    let isDrawing = false;
    let lastX = 0, lastY = 0;
    let blurRadius = 12;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return [(clientX - rect.left) * scaleX, (clientY - rect.top) * scaleY];
    }

    function applyBlur(x, y) {
      const ctx = editCtx;
      const r = blurRadius;
      const pixelSize = 8;
      for (let dx = -r; dx < r; dx += pixelSize) {
        for (let dy = -r; dy < r; dy += pixelSize) {
          const px = Math.max(0, Math.min(canvas.width - 1, Math.round(x + dx)));
          const py = Math.max(0, Math.min(canvas.height - 1, Math.round(y + dy)));
          const imgData = ctx.getImageData(px, py, pixelSize, pixelSize);
          let sumR = 0, sumG = 0, sumB = 0, cnt = 0;
          for (let i = 0; i < imgData.data.length; i += 4) {
            sumR += imgData.data[i]; sumG += imgData.data[i + 1]; sumB += imgData.data[i + 2]; cnt++;
          }
          const avgR = Math.round(sumR / cnt), avgG = Math.round(sumG / cnt), avgB = Math.round(sumB / cnt);
          ctx.fillStyle = `rgb(${avgR},${avgG},${avgB})`;
          ctx.fillRect(px, py, pixelSize, pixelSize);
        }
      }
    }

    canvas?.addEventListener('mousedown', e => { isDrawing = true; const [x, y] = getPos(e); lastX = x; lastY = y; });
    canvas?.addEventListener('mousemove', e => {
      if (!isDrawing) return;
      const [x, y] = getPos(e);
      if (editMode === 'brush') {
        editCtx.strokeStyle = '#FFBED5';
        editCtx.lineCap = 'round';
        editCtx.lineJoin = 'round';
        editCtx.beginPath();
        editCtx.moveTo(lastX, lastY);
        editCtx.lineTo(x, y);
        editCtx.stroke();
      } else {
        applyBlur(x, y);
      }
      lastX = x; lastY = y;
    });
    canvas?.addEventListener('mouseup', () => { if (isDrawing) { isDrawing = false; editHistory.push(canvas.toDataURL()); } });
    canvas?.addEventListener('mouseleave', () => { if (isDrawing) { isDrawing = false; editHistory.push(canvas.toDataURL()); } });

    canvas?.addEventListener('touchstart', e => { e.preventDefault(); isDrawing = true; const [x, y] = getPos(e); lastX = x; lastY = y; }, { passive: false });
    canvas?.addEventListener('touchmove', e => {
      e.preventDefault();
      if (!isDrawing) return;
      const [x, y] = getPos(e);
      if (editMode === 'brush') {
        editCtx.strokeStyle = '#FFBED5';
        editCtx.lineCap = 'round';
        editCtx.lineJoin = 'round';
        editCtx.beginPath();
        editCtx.moveTo(lastX, lastY);
        editCtx.lineTo(x, y);
        editCtx.stroke();
      } else {
        applyBlur(x, y);
      }
      lastX = x; lastY = y;
    }, { passive: false });
    canvas?.addEventListener('touchend', () => { if (isDrawing) { isDrawing = false; editHistory.push(canvas.toDataURL()); } });
  });

      if (e.key === 'ArrowRight') imgModalNext();
    }
  });

  function createParticles() {
    const container = document.getElementById('particles');
    if (!container) return;
    for (let i = 0; i < 12; i++) {
      const dot = document.createElement('span');
      dot.className = 'particle';
      dot.style.left = Math.random() * 100 + '%';
      dot.style.animationDelay = Math.random() * 15 + 's';
      dot.style.animationDuration = (10 + Math.random() * 10) + 's';
      dot.style.width = dot.style.height = (2 + Math.random() * 3) + 'px';
      dot.style.opacity = 0.08 + Math.random() * 0.15;
      container.appendChild(dot);
    }
  }

  checkDraft();
  updateUserStatus();
  updateNavBadge();
  updateNavUser();
  createParticles();
  setActiveNav('submit.html');
</script>
<!-- 用户登录弹窗 -->
<div class="modal-overlay" id="userModal" onclick="closeUserModal()">
  <div class="modal glass-card user-modal" onclick="event.stopPropagation()">
    <div class="user-modal-icon">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="16" fill="#FFE6F0"/>
        <path d="M20 30 C12 24 8 18 12 13 C16 9 20 14 20 14 C20 14 24 9 28 13 C32 18 28 24 20 30Z" fill="#FFBED5"/>
      </svg>
    </div>
    <div class="user-modal-tabs">
      <button class="user-modal-tab active" id="tabLogin" onclick="switchAuthTab('login')">登录</button>
      <button class="user-modal-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</button>
    </div>
    <div class="user-modal-error" id="userModalError" style="display:none;"></div>
    <form id="loginFormUser" onsubmit="handleUserLogin(event)">
      <div class="form-group">
        <label class="input-label">用户名</label>
        <input type="text" class="input" id="loginUsername" placeholder="输入用户名" required maxlength="20" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="input-label">密码</label>
        <input type="password" class="input" id="loginPassword" placeholder="输入密码" required maxlength="30">
      </div>
      <button type="submit" class="btn btn-login-full" style="width:100%;margin-top:4px;">登录</button>
      <p class="user-modal-hint">演示账号 <code>admin</code> / <code>admin123</code></p>
    </form>
    <form id="registerFormUser" onsubmit="handleUserRegister(event)" style="display:none;">
      <div class="form-group">
        <label class="input-label">设置用户名</label>
        <input type="text" class="input" id="regUsername" placeholder="2-20个字符，不能含表情" required maxlength="20" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="input-label">王者荣耀世界ID <span style="font-size:0.70rem;color:var(--gray-400);font-weight:400;">（选填，用于防恶意注册）</span></label>
        <input type="text" class="input" id="regHonorWorldId" placeholder="如：初恋、小明123" maxlength="30" autocomplete="off">
      </div>
      <div class="form-group">
        <label class="input-label">设置密码</label>
        <input type="password" class="input" id="regPassword" placeholder="至少6个字符" required maxlength="30">
      </div>
      <div class="form-group">
        <label class="input-label">确认密码</label>
        <input type="password" class="input" id="regPassword2" placeholder="再次输入密码" required maxlength="30">
      </div>
      <button type="submit" class="btn btn-login-full" style="width:100%;margin-top:4px;">注册</button>
    </form>
    <button class="modal-close-btn" onclick="closeUserModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
</div>
