<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>重置公告数据</title>
<style>
body{font-family:'Noto Sans SC',sans-serif;padding:40px;background:#F8F7F4;text-align:center}
.card{background:#fff;border-radius:20px;padding:40px;max-width:440px;margin:60px auto;box-shadow:0 8px 32px rgba(0,0,0,0.08)}
h1{color:#E88AAA;margin-bottom:20px}
p{color:#8A8A88;line-height:1.7;margin-bottom:24px}
.btn{padding:14px 32px;background:linear-gradient(135deg,#FFBED5,#E88AAA);color:#fff;border:none;border-radius:999px;font-size:1rem;cursor:pointer;font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,138,170,0.3)}
</style>
</head>
<body>
<div class="card">
  <h1>公告重置工具</h1>
  <p>点击下方按钮会清除旧的公告数据，重新写入新的内置公告（包含置顶公告和详细说明）。完成后自动跳转首页。</p>
  <button class="btn" onclick="resetAndGo()">清除并重新初始化</button>
</div>
<script src="common.js"></script>
<script>
function resetAndGo(){
  localStorage.removeItem('announcements');
  localStorage.removeItem('blacklist_records');
  location.href='index.html';
}
var anns=DB.getAnnouncements();
if(anns.length===0){
  document.querySelector('.card').innerHTML='<h1>没有问题！</h1><p>当前没有公告数据，刷新首页后会自动初始化。</p><button class=btn onclick=location.href="index.html">去首页看看</button>';
}else{
  document.querySelector('.card').innerHTML+='<p style="margin-top:16px;font-size:0.85rem;color:#E88AAA;">当前已有 '+anns.length+' 条公告，请点击上方按钮重置</p>';
}
</script>
</body>
</html>
