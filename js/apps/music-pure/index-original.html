<html> 
<head> 
    <meta charset="UTF-8">
    <!-- 其他meta标签、title、link、style等写在后面 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style> 
* { 
    margin: 0; /* 去掉所有元素的默认外边距 */ 
    padding: 0; /* 去掉所有元素的默认内边距 */ 
    box-sizing: border-box; /* 盒模型计算方式，内边距和边框不会撑大盒子 */ 
    } 
body { 
    background:#f0f2f5; 
    min-height:100vh; 
    width:100vw;  
    display:flex; 
    align-items:center; 
    justify-content:center; 
} 
.phone-case { 
    width:390px; 
    height:590px; 
    background:linear-gradient(135deg, #f6d3e0 0%, #b4d7f2 100%); 
    border-radius:50px; 
    box-shadow:0 20px 45px rgba(0,0,0,0.25); 
    padding:8px; 
} 
.phone-screen{ 
    position:relative; 
    width:100%; 
    height:100%; 
    background-color:#f5f5f5; 
    border-radius:40px; 
    overflow:hidden; 
} 
.status-bar{ 
    position:absolute; 
    top:0px; 
    left:0; 
    width:100%; 
    height:50px; 
    /* background:#ffffff; */ 
    display:flex; 
    justify-content:space-between; 
    align-items:center; 
    padding:5px 20px; 
    font-weight:600; 
    z-index:999; 
} 
.time{ 
    color:#000000; 
} 
.status-icons{ 
    display:flex; 
    gap:6px; 
    display:flex; 
    align-items:center; 
} 
.battery{ 
    width:26px; 
    height:12px; 
    border-radius:4px; 
    background-color:#BDBDBD; 
    position:relative; 
} 
.battery::before{ 
    content:''; 
    background-color:#BDBDBD; 
    top:50%; 
    right:-3px; 
    width:2px; 
    height:5px; 
    position:absolute; 
    transform:translateY(-50%); 
} 
.battery::after{ 
    content:''; 
    position:absolute; 
    width:calc(17px - 2px); 
    height:calc(14px - 2px); 
    background-color:#73AE52; 
    border-radius:4px 0px 0px 4px; 
} 
.signal{ 
    display:flex; 
    align-items:flex-end; 
    height:12px; 
    gap:2px; 
} 
.signal-bar{ 
    width:3px; 
    background-color:#000000; 
    border-radius:1px; 
} 
.signal-bar:nth-child(1){height:4px;} 
.signal-bar:nth-child(2){height:7px;} 
.signal-bar:nth-child(3){height:10px;} 
.signal-bar:nth-child(4){height:12px;} 
 
.five-g{ 
    font-size:12px; 
    font-weight:bold; 
    color:#000; 
    margin-left:2px; 
} 
 
.dynamic-island{ 
    background-color:#000; 
    width:100px; 
    height:36px; 
    position:absolute; 
    top:15px; 
    left:50%; /* 水平居中预备 */ 
    transform:translateX(-50%); /* 水平居中实现 */ 
    transition: all 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55); 
    border-radius:25px; 
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1); 
    z-index: 1000; 
    cursor: pointer; 
    transform-origin:center center; 
} 
 
.dynamic-island-content { /* 灵动岛展开后内部内容 */ 
    color: white;  
    opacity: 0; /* 文字白色，初始透明 */ 
    transition: opacity 0.3s ease-in-out 0.15s; /* 透明度过渡，延迟显示 */ 
    width: 100%; height: 100%; pointer-events: none; /* 占满，初始不可点击 */ 
    display: flex; flex-direction: column; justify-content: flex-start; /* flex布局，垂直排列，从顶部开始 */ 
    padding: 10px 15px; /* 内边距 */ 
    box-sizing: border-box; /* 确保padding不会影响整体布局 */ 
} 
 
.dynamic-island.active { transform:translateX(-50%) scale(1.1); } 
 
.dynamic-island.medium { 
    width: 240px; 
    height: 135px; 
    border-radius: 30px; 
    overflow: hidden; 
} 
 
.dynamic-island.large { 
    width: 280px; 
    height: 320px; 
    border-radius: 35px; 
    overflow: hidden; 
} 
 
 
.desktop{ 
    position:absolute; 
    top:70px; 
    left:50%; 
    transform:translateX(-50%); 
    width:85%; 
    background:#fff; 
    display:grid; 
    grid-template-columns:repeat(4,1fr); 
    grid-template-rows:repeat(5,auto); 
    gap:25px 15px; 
     
} 
 
.app-dock{ 
    position:absolute; 
    bottom:15px; 
    left:50%; 
    transform:translateX(-50%); 
    background-color:rgba(255, 255, 255, 0.2);  
    box-shadow: 0 0 0 0.5px rgba(255,255,255,0.3) inset, 0 8px 25px rgba(0,0,0,0.15); /* Dock栏精致阴影和内发光 */ 
    width:92%; 
    height:60px; 
    -webkit-backdrop-filter: blur(30px) saturate(180%); /* Safari兼容 */ 
    border-radius: 50px; /* Dock栏圆角 */ 
    display:flex; 
    align-items:center; 
    justify-content:center; 
} 
 
.app-icon{ 
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12); /* 图标柔和阴影 */ 
    width:60px; 
    height:60px; 
    border-radius:15px; 
    transition: transform 0.1s cubic-bezier(0.215, 0.610, 0.355, 1); /* 点击时的过渡效果 */ 
    cursor: pointer; /* 鼠标指针变为手型 */ 
    display:flex; 
    align-items:center; 
    justify-content:center; 
} 
 
.app-icon:active { /* 图标被点击时的效果 */ 
    transform: scale(0.93); /* 轻微缩小 */ 
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); 
} 
 
.app-icon-name{ 
    position:absolute; 
    bottom:-22px; 
    font-size:12px; 
    color:#fff; 
    text-shadow:0 1px 3px rgba(0,0,0,0.5); 
    white-space:nowrap; 
    text-align:center; 
    width:120%; 
    left:-10%; 
} 
 
.app-dock .app-icon{ 
    width:40px; 
    height:40px; 
    margin:0 10px; 
} 
 
.app-wrapper{ 
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    position:relative; 
    margin:5px 0; 
} 
 
 
.app-window{ 
    display:flex; 
    flex-direction:column; 
    position:absolute; 
    top:0; 
    left:0; 
    width:100%; 
    height:100%; 
    z-index:100; 
    display:flex; 
    flex-direction:column; 
    animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
    border-radius: 25px; 
    overflow: hidden; 
} 
 
.app-window.hidden { 
    display: none; 
} 
 
.app-status-bar-gap { height:40px;flex-shrink:0; } 
.app-content-page { flex-grow:1;overflow-y:auto;position: relative; } 
.app-content-page::-webkit-scrollbar{display:none;} 
 
.home-indicator { 
    width: 120px; 
    height: 5px; 
    background: rgba(255, 255, 255, 0.6); 
    border-radius: 10px; 
    margin: 10px auto; /* 居中 */ 
    cursor: pointer; 
} 
 
.home-indicator-area { 
    position: absolute; 
    bottom: 0; 
    left: 0; 
    width: 100%; 
    height: 30px; 
    cursor: pointer; 
    z-index: 10; 
} 
 
.app-tab-bar { 
    display: flex; 
    justify-content: space-around; 
    align-items: center; 
    height: 40px; 
    // background: rgba(255, 255, 255, 0.9); 
    flex-shrink: 0; 
    // padding-bottom: 10px; 
    backdrop-filter: blur(10px); 
    z-index: 20; 
    position: relative; 
} 
 
.app-tab-item { 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    flex: 1; 
    height: 100%; 
    cursor: pointer; 
    color: #999; 
    font-size: 10px; 
    transition: color 0.2s; 
} 
 
.app-tab-item.active { 
    color: #007AFF; 
} 
 
.app-tab-item .tab-icon { 
    font-size: 20px; 
    margin-bottom: 2px; 
} 
 
.app-page-stack { 
    position: relative; 
    flex: 1; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    // border-radius: 30px; 
} 
 
.app-page { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    background: inherit; 
    overflow-y: auto; 
    display: flex; 
    flex-direction: column; 
} 
 
.app-page.slide-in { 
    animation: pageSlideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
    z-index: 50; 
    border-radius: 30px; 
} 
 
.app-page.slide-out { 
    animation: pageSlideOut 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
    z-index: 50; 
} 
 
@keyframes pageSlideIn { 
    from { 
        transform: translateX(100%); 
    } 
    to { 
        transform: translateX(0); 
    } 
} 
 
@keyframes pageSlideOut { 
    from { 
        transform: translateX(0); 
    } 
    to { 
        transform: translateX(100%); 
    } 
} 
 
.app-back-btn { 
    display: flex; 
    align-items: center; 
    padding: 10px 15px; 
    font-size: 16px; 
    cursor: pointer; 
    z-index: 51; 
} 
 
.app-back-btn::before { 
    content: '‹'; 
    font-size: 30px; 
    margin-right: 5px; 
    margin-top: -2px; 
} 
</style> 
</head>

<script> 
const DynamicIsland = { 
    el: document.getElementById("dynamic-island"), 
    activeApp: null, 
    mode: 'quiet', 
 
    setApp: function(app) { 
        this.activeApp = app; 
        if (app && this.mode === 'quiet') { 
            this.mode = 'medium'; 
        } 
        this.updateUI(); 
    }, 
 
    clearApp: function() { 
        this.activeApp = null; 
        this.mode = 'quiet'; 
        this.updateUI(); 
    }, 
 
    handleClick: function() { 
 
        if (!this.activeApp) { 
            this.mode = (this.mode === 'quiet') ? 'active' : 'quiet'; 
            this.updateUI(); 
            setTimeout(()=>{this.mode = 'quiet';this.updateUI();},300); 
        } else { 
            if (this.mode === 'quiet') { 
                this.mode = 'medium'; 
            } else if (this.mode === 'medium') { 
                this.mode = 'large'; 
            } else if (this.mode === 'large') { 
                this.mode = 'medium'; 
            } 
        } 
        this.updateUI(); 
    }, 
 
    expandToLarge: function() { 
        this.mode = 'large'; 
        this.updateUI(); 
    }, 
 
    shrink: function() { 
        if (this.mode === 'large') { 
            this.mode = 'medium'; 
        } else if (this.mode === 'medium'||this.mode === 'active') { 
            this.mode = 'quiet'; 
        } 
        this.clickCount = 0; 
        this.updateUI(); 
    }, 
 
    updateUI: function() { 
        this.el.className = 'dynamic-island ' + this.mode; 
        this.el.innerHTML = ''; 
 
        if (this.activeApp && this.mode !== 'quiet') { 
            const content = this.activeApp.renderIslandContent(this.mode); 
            this.el.innerHTML = content; 
            if (this.activeApp.bindIslandEvents) { 
                this.activeApp.bindIslandEvents(this.el); 
            } 
        } else if (this.activeApp && this.mode === 'quiet') { 
            const content = this.activeApp.renderIslandContent('quiet'); 
            this.el.innerHTML = content; 
        } else if (!this.activeApp && this.mode === 'medium') { 
            this.el.innerHTML = '<div style="color:white;padding:10px;text-align:center;">暂无活动</div>'; 
        } 
    }, 
 
    init: function() { 
        const self = this; 
        this.el.onclick = function(e) { 
            e.stopPropagation(); 
            self.handleClick(); 
        }; 
    } 
}; 
 
DynamicIsland.init(); 
 
document.getElementById('phone-screen').addEventListener('click', function(e) { 
    if (!DynamicIsland.el.contains(e.target)) { 
        DynamicIsland.shrink(); 
    } 
}, true); 
 
//原型app 
 
function MyBaseApp(config) { 
    this.id = config.id; 
    this.name = config.name; 
    this.color = config.color; 
    this.barStyle = config.barStyle || 'dark'; 
    this.tabs = config.tabs || []; 
    this.island = config.island || null; 
     
    this.iconEl = document.getElementById(this.id); 
    this.appWindow = null; 
    this.currentTabIndex = 0; 
    this.isCardMode = false; 
    this.isCardDragging = false; 
    this.pageStack = []; 
    this.detailPageHomeIndicatorEnabled = config.detailPageHomeIndicatorEnabled !== false; 
     
    if (this.iconEl) { 
        const self = this; 
        this.iconEl.onclick = function() { 
            self.open(); 
        }; 
    } 
} 
 
MyBaseApp.prototype.renderIslandContent = function(mode) { 
    if (this.island && this.island.render) { 
        return this.island.render(mode, this.island.state, this); 
    } 
    return ''; 
}; 
 
MyBaseApp.prototype.bindIslandEvents = function(container) { 
    if (this.island && this.island.bindEvents) { 
        this.island.bindEvents(container, this.island.state, this); 
    } 
}; 
 
MyBaseApp.prototype.activateIsland = function() { 
    DynamicIsland.setApp(this); 
}; 
 
MyBaseApp.prototype.deactivateIsland = function() { 
    if (DynamicIsland.activeApp === this) { 
        DynamicIsland.clearApp(); 
    } 
}; 
 
MyBaseApp.prototype.render = function() { 
    const self = this; 
     
    const win = document.createElement('div'); 
    win.className = 'app-window hidden'; 
    win.style.backgroundColor = this.color; 
     
    const indicatorColor = this.barStyle === 'light' ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.3)'; 
     
    let tabBarHtml = ''; 
    let tabContentHtml = ''; 
     
    if (this.tabs.length > 0) { 
        const tabItems = this.tabs.map(function(tab, index) { 
            const activeClass = index === 0 ? 'active' : ''; 
            return '<div class="app-tab-item ' + activeClass + '" data-index="' + index + '">' + 
                       '<span class="tab-icon">' + tab.icon + '</span>' + 
                       '<span>' + tab.name + '</span>' + 
                   '</div>'; 
        }).join(''); 
         
        tabBarHtml = '<div class="app-tab-bar">' + tabItems + '</div>'; 
        tabContentHtml = this.tabs[0].content || ''; 
    } 
     
    win.innerHTML =  
        '<div class="app-status-bar-gap"></div>' + 
        '<div class="app-page-stack">' + 
            '<div class="app-content-page" id="main-content-area">' + tabContentHtml + '</div>' + 
        '</div>' + 
        tabBarHtml + 
        '<div class="home-indicator-area"></div>' + 
        '<div class="home-indicator" style="background-color:' + indicatorColor + ';"></div>'; 
     
    document.getElementById('appContainer').appendChild(win); 
    this.appWindow = win; 
     
    this.bindTabEvents(); 
    this.bindHomeIndicatorEvents(); 
     
    if (this.island && this.island.onAppReady) { 
        this.island.onAppReady(this.appWindow, this); 
    } 
}; 
 
MyBaseApp.prototype.bindTabEvents = function() { 
    if (this.tabs.length === 0) return; 
     
    const self = this; 
    const tabItems = this.appWindow.querySelectorAll('.app-tab-item'); 
    const contentArea = this.appWindow.querySelector('#main-content-area'); 
     
    tabItems.forEach(function(item, index) { 
        item.onclick = function(e) { 
            e.stopPropagation(); 
            if (index === self.currentTabIndex) return; 
             
            tabItems.forEach(function(t) { t.classList.remove('active'); }); 
            item.classList.add('active'); 
             
            contentArea.innerHTML = self.tabs[index].content || ''; 
            self.currentTabIndex = index; 
             
            if (self.island && self.island.onTabChange) { 
                self.island.onTabChange(contentArea, self); 
            } 
        }; 
    }); 
}; 
 
MyBaseApp.prototype.openDetailPage = function(contentHtml, options) { 
    if (!this.appWindow) return; 
     
    options = options || {}; 
    const self = this; 
    const indicatorColor = this.barStyle === 'light' ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.3)'; 
    const backBtnColor = this.barStyle === 'light' ? '#fff' : '#007AFF'; 
    const enableHomeIndicator = options.enableHomeIndicator !== false && this.detailPageHomeIndicatorEnabled; 
     
    const page = document.createElement('div'); 
    page.className = 'app-page slide-in'; 
    page.style.cssText = 'position:absolute; top:0; left:0; width:100%; height:100%; ' + 
                         'background:' + (options.background || this.color) + '; z-index:100; display:flex; flex-direction:column;'; 
     
    page.innerHTML =  
        '<div class="app-status-bar-gap"></div>' + 
        '<div class="app-back-btn" style="color:' + backBtnColor + ';">返回</div>' + 
        '<div class="app-content-page" style="flex:1; overflow-y:auto; padding:0;">' + 
            contentHtml + 
        '</div>' + 
        '<div class="home-indicator" style="background:' + indicatorColor + '; margin-top:auto; margin-bottom:10px;"></div>' + 
        (enableHomeIndicator ? '<div class="home-indicator-area detail-home-indicator"></div>' : ''); 
     
    const backBtn = page.querySelector('.app-back-btn'); 
    backBtn.onclick = function() { 
        page.classList.remove('slide-in'); 
        page.classList.add('slide-out'); 
        setTimeout(function() {  
            page.remove();  
            self.pageStack.pop(); 
        }, 300); 
    }; 
     
    if (enableHomeIndicator) { 
        const homeIndicatorArea = page.querySelector('.detail-home-indicator'); 
        if (homeIndicatorArea) { 
            this.bindDetailPageHomeIndicator(homeIndicatorArea, page); 
        } 
    } 
     
    this.appWindow.appendChild(page); 
    this.pageStack.push(page); 
     
    return page; 
}; 
 
MyBaseApp.prototype.bindDetailPageHomeIndicator = function(handle, page) { 
    const self = this; 
    let startY = 0; 
    let moveY = 0; 
    let isDragging = false; 
     
    function handleStart(clientY) { 
        if (self.isCardMode) return; 
        startY = clientY; 
        moveY = 0; 
        isDragging = true; 
        self.appWindow.style.transition = 'none'; 
    } 
     
    function handleMove(clientY) { 
        if (!isDragging || self.isCardMode) return; 
        moveY = clientY - startY; 
         
        if (moveY > 0) { moveY = 0; return; } 
         
        let scale = 1 - Math.abs(moveY) / 800; 
        if (scale < 0.6) scale = 0.6; 
         
        let blur = Math.abs(moveY) / 30; 
        if (blur > 20) blur = 20; 
         
        let borderRadius = 40 + Math.abs(moveY) / 15; 
        if (borderRadius > 50) borderRadius = 50; 
         
        self.appWindow.style.transform = 'translateY(' + (moveY * 0.5) + 'px) scale(' + scale + ')'; 
        self.appWindow.style.borderRadius = borderRadius + 'px'; 
        document.getElementById('desktop').style.filter = 'blur(' + blur + 'px)'; 
    } 
     
    function handleEnd() { 
        if (!isDragging || self.isCardMode) return; 
        isDragging = false; 
         
        self.appWindow.style.transition = 'all 0.4s cubic-bezier(0.2,0.8,0.2,1)'; 
         
        if (Math.abs(moveY) > 120) { 
            self.switchToCardMode(); 
        } else { 
            self.appWindow.style.transform = ''; 
            self.appWindow.style.borderRadius = '40px'; 
            document.getElementById('desktop').style.filter = 'blur(0px)'; 
        } 
    } 
     
    handle.ontouchstart = function(e) { e.preventDefault(); handleStart(e.touches[0].clientY); }; 
    handle.ontouchmove = function(e) { e.preventDefault(); handleMove(e.touches[0].clientY); }; 
    handle.ontouchend = function(e) { e.preventDefault(); handleEnd(); }; 
     
    handle.onmousedown = function(e) { 
        e.preventDefault(); 
        handleStart(e.clientY); 
         
        function mouseMoveHandler(e) { e.preventDefault(); handleMove(e.clientY); } 
        function mouseUpHandler(e) {  
            e.preventDefault();  
            handleEnd();  
            document.removeEventListener('mousemove', mouseMoveHandler); 
            document.removeEventListener('mouseup', mouseUpHandler); 
        } 
         
        document.addEventListener('mousemove', mouseMoveHandler); 
        document.addEventListener('mouseup', mouseUpHandler); 
    }; 
}; 
 
MyBaseApp.prototype.open = function() { 
    if (!this.appWindow) { 
        this.render(); 
    } 
     
    const self = this; 
     
    const iconRect = this.iconEl.getBoundingClientRect(); 
    const screenRect = document.getElementById('phone-screen').getBoundingClientRect(); 
    const startX = iconRect.left - screenRect.left; 
    const startY = iconRect.top - screenRect.top; 
    const centerX = startX + iconRect.width / 2; 
    const centerY = startY + iconRect.height / 2; 
     
    this.appWindow.style.left = '0'; 
    this.appWindow.style.top = '0'; 
    this.appWindow.style.width = '100%'; 
    this.appWindow.style.height = '100%'; 
    this.appWindow.style.transformOrigin = centerX + 'px ' + centerY + 'px'; 
    this.appWindow.style.transform = 'scale(0.1)'; 
    this.appWindow.style.opacity = '0'; 
    this.appWindow.style.borderRadius = '40px'; 
    this.appWindow.style.transition = 'none'; 
     
    this.appWindow.classList.remove('hidden'); 
    this.appWindow.offsetHeight; 
     
    this.appWindow.style.transition = 'transform 0.4s cubic-bezier(0.2,0.8,0.2,1), ' + 
                                       'opacity 0.4s cubic-bezier(0.2,0.8,0.2,1), ' + 
                                       'border-radius 0.4s cubic-bezier(0.2,0.8,0.2,1)'; 
     
    requestAnimationFrame(function() { 
        self.appWindow.style.transform = 'scale(1)'; 
        self.appWindow.style.opacity = '1'; 
        self.appWindow.style.borderRadius = '40px'; 
    }); 
     
    setTimeout(function() { 
        self.appWindow.style.transition = ''; 
        self.appWindow.style.transformOrigin = ''; 
    }, 400); 
}; 
 
MyBaseApp.prototype.bindHomeIndicatorEvents = function() { 
    const self = this; 
    const handle = this.appWindow.querySelector('.home-indicator-area'); 
    if (!handle) return; 
     
    let startY = 0; 
    let moveY = 0; 
    let isDragging = false; 
     
    function handleStart(clientY) { 
        if (self.isCardMode) return; 
        startY = clientY; 
        moveY = 0; 
        isDragging = true; 
        self.appWindow.style.transition = 'none'; 
    } 
     
    function handleMove(clientY) { 
        if (!isDragging || self.isCardMode) return; 
        moveY = clientY - startY; 
         
        if (moveY > 0) { moveY = 0; return; } 
         
        let scale = 1 - Math.abs(moveY) / 800; 
        if (scale < 0.6) scale = 0.6; 
         
        let blur = Math.abs(moveY) / 30; 
        if (blur > 20) blur = 20; 
         
        let borderRadius = 40 + Math.abs(moveY) / 15; 
        if (borderRadius > 50) borderRadius = 50; 
         
        self.appWindow.style.transform = 'translateY(' + (moveY * 0.5) + 'px) scale(' + scale + ')'; 
        self.appWindow.style.borderRadius = borderRadius + 'px'; 
        document.getElementById('desktop').style.filter = 'blur(' + blur + 'px)'; 
    } 
     
    function handleEnd() { 
        if (!isDragging || self.isCardMode) return; 
        isDragging = false; 
         
        self.appWindow.style.transition = 'all 0.4s cubic-bezier(0.2,0.8,0.2,1)'; 
         
        if (Math.abs(moveY) > 120) { 
            self.switchToCardMode(); 
        } else { 
            self.appWindow.style.transform = ''; 
            self.appWindow.style.borderRadius = '40px'; 
            document.getElementById('desktop').style.filter = 'blur(0px)'; 
        } 
    } 
     
    handle.ontouchstart = function(e) { e.preventDefault(); handleStart(e.touches[0].clientY); }; 
    handle.ontouchmove = function(e) { e.preventDefault(); handleMove(e.touches[0].clientY); }; 
    handle.ontouchend = function(e) { e.preventDefault(); handleEnd(); }; 
     
    handle.onmousedown = function(e) { 
        e.preventDefault(); 
        handleStart(e.clientY); 
         
        function mouseMoveHandler(e) { e.preventDefault(); handleMove(e.clientY); } 
        function mouseUpHandler(e) {  
            e.preventDefault();  
            handleEnd();  
            document.removeEventListener('mousemove', mouseMoveHandler); 
            document.removeEventListener('mouseup', mouseUpHandler); 
        } 
         
        document.addEventListener('mousemove', mouseMoveHandler); 
        document.addEventListener('mouseup', mouseUpHandler); 
    }; 
}; 
 
MyBaseApp.prototype.switchToCardMode = function() { 
    const self = this; 
    this.isCardMode = true; 
     
    const screen = document.getElementById('phone-screen'); 
    const screenRect = screen.getBoundingClientRect(); 
     
    const cardWidth = 280; 
    const cardHeight = 400; 
    const targetX = (screenRect.width - cardWidth) / 2; 
    const targetY = (screenRect.height - cardHeight) / 2 - 30; 
     
    this.appWindow.style.transition = 'all 0.4s cubic-bezier(0.2,0.8,0.2,1)'; 
    this.appWindow.style.position = 'absolute'; 
    this.appWindow.style.left = targetX + 'px'; 
    this.appWindow.style.top = targetY + 'px'; 
    this.appWindow.style.width = cardWidth + 'px'; 
    this.appWindow.style.height = cardHeight + 'px'; 
    this.appWindow.style.transform = 'scale(1)'; 
    this.appWindow.style.borderRadius = '25px'; 
    this.appWindow.style.boxShadow = '0 20px 50px rgba(0,0,0,0.3)'; 
     
    document.getElementById('desktop').style.filter = 'blur(20px)'; 
     
    const appContent = this.appWindow.querySelector('.app-content-page'); 
    const homeIndicator = this.appWindow.querySelector('.home-indicator'); 
    const tabBar = this.appWindow.querySelector('.app-tab-bar'); 
    const homeIndicatorArea = this.appWindow.querySelector('.home-indicator-area'); 
     
    if (appContent) appContent.style.pointerEvents = 'none'; 
    if (homeIndicator) homeIndicator.style.display = 'none'; 
    if (tabBar) tabBar.style.display = 'none'; 
    if (homeIndicatorArea) homeIndicatorArea.style.display = 'none'; 
     
    setTimeout(function() { 
        self.appWindow.style.transition = ''; 
        self.bindCardDragEvents(); 
         
        self.appWindow.onclick = function(e) { 
            if (self.isCardMode && !self.isCardDragging) { 
                e.stopPropagation(); 
                self.restoreFromCardMode(); 
            } 
        }; 
    }, 400); 
}; 
 
MyBaseApp.prototype.restoreFromCardMode = function() { 
    const self = this; 
    this.isCardMode = false; 
     
    this.appWindow.style.transition = 'all 0.4s cubic-bezier(0.2,0.8,0.2,1)'; 
    this.appWindow.style.position = 'absolute'; 
    this.appWindow.style.left = '0'; 
    this.appWindow.style.top = '0'; 
    this.appWindow.style.width = '100%'; 
    this.appWindow.style.height = '100%'; 
    this.appWindow.style.transform = 'scale(1)'; 
    this.appWindow.style.borderRadius = '40px'; 
    this.appWindow.style.boxShadow = 'none'; 
     
    document.getElementById('desktop').style.filter = 'blur(0px)'; 
     
    const appContent = this.appWindow.querySelector('.app-content-page'); 
    const homeIndicator = this.appWindow.querySelector('.home-indicator'); 
    const tabBar = this.appWindow.querySelector('.app-tab-bar'); 
    const homeIndicatorArea = this.appWindow.querySelector('.home-indicator-area'); 
     
    if (appContent) appContent.style.pointerEvents = 'auto'; 
    if (homeIndicator) homeIndicator.style.display = ''; 
    if (tabBar) tabBar.style.display = ''; 
    if (homeIndicatorArea) homeIndicatorArea.style.display = ''; 
     
    this.appWindow.onclick = null; 
     
    setTimeout(function() { 
        self.appWindow.style.transition = ''; 
        self.appWindow.style.position = ''; 
    }, 400); 
}; 
 
MyBaseApp.prototype.bindCardDragEvents = function() { 
    const self = this; 
     
    let cardStartX = 0; 
    let cardStartY = 0; 
    let cardMoveX = 0; 
    let cardMoveY = 0; 
    let cardStartLeft = 0; 
    let cardStartTop = 0; 
     
    function handleCardStart(clientX, clientY) { 
        if (!self.isCardMode) return; 
         
        cardStartX = clientX; 
        cardStartY = clientY; 
        cardMoveX = 0; 
        cardMoveY = 0; 
        self.isCardDragging = false; 
         
        cardStartLeft = parseFloat(self.appWindow.style.left) || 0; 
        cardStartTop = parseFloat(self.appWindow.style.top) || 0; 
         
        self.appWindow.style.transition = 'none'; 
    } 
     
    function handleCardMove(clientX, clientY) { 
        if (!self.isCardMode) return; 
         
        cardMoveX = clientX - cardStartX; 
        cardMoveY = clientY - cardStartY; 
         
        if (Math.abs(cardMoveX) > 5 || Math.abs(cardMoveY) > 5) { 
            self.isCardDragging = true; 
        } 
         
        if (self.isCardDragging) { 
            self.appWindow.style.left = (cardStartLeft + cardMoveX) + 'px'; 
            self.appWindow.style.top = (cardStartTop + cardMoveY) + 'px'; 
             
            const distance = Math.sqrt(cardMoveX * cardMoveX + cardMoveY * cardMoveY); 
            const opacity = 1 - distance / 400; 
            const rotate = cardMoveX / 20; 
             
            self.appWindow.style.opacity = Math.max(0.3, opacity); 
            self.appWindow.style.transform = 'rotate(' + rotate + 'deg)'; 
        } 
    } 
     
    function handleCardEnd() { 
        if (!self.isCardMode) return; 
         
        if (!self.isCardDragging) { 
            self.appWindow.style.transition = ''; 
            return; 
        } 
         
        self.appWindow.style.transition = 'all 0.3s ease-out'; 
        const distance = Math.sqrt(cardMoveX * cardMoveX + cardMoveY * cardMoveY); 
         
        if (distance > 100) { 
            self.exit(); 
        } else { 
            self.appWindow.style.left = cardStartLeft + 'px'; 
            self.appWindow.style.top = cardStartTop + 'px'; 
            self.appWindow.style.opacity = '1'; 
            self.appWindow.style.transform = 'rotate(0deg)'; 
        } 
         
        setTimeout(function() { self.isCardDragging = false; }, 50); 
    } 
     
    this.appWindow.ontouchstart = function(e) { 
        if (!self.isCardMode) return; 
        handleCardStart(e.touches[0].clientX, e.touches[0].clientY); 
    }; 
    this.appWindow.ontouchmove = function(e) { 
        if (!self.isCardMode) return; 
        handleCardMove(e.touches[0].clientX, e.touches[0].clientY); 
    }; 
    this.appWindow.ontouchend = function(e) { 
        if (!self.isCardMode) return; 
        handleCardEnd(); 
    }; 
     
    this.appWindow.onmousedown = function(e) { 
        if (!self.isCardMode) return; 
        handleCardStart(e.clientX, e.clientY); 
         
        function mouseMoveHandler(e) { handleCardMove(e.clientX, e.clientY); } 
        function mouseUpHandler(e) {  
            handleCardEnd();  
            document.removeEventListener('mousemove', mouseMoveHandler); 
            document.removeEventListener('mouseup', mouseUpHandler); 
        } 
         
        document.addEventListener('mousemove', mouseMoveHandler); 
        document.addEventListener('mouseup', mouseUpHandler); 
    }; 
}; 
 
MyBaseApp.prototype.exit = function() { 
    const self = this; 
     
    this.appWindow.style.transition = 'all 0.3s ease-out'; 
     
    if (this.isCardMode) { 
        this.appWindow.style.transform = 'translateY(-200px) scale(0.5) rotate(0deg)'; 
        this.appWindow.style.opacity = '0'; 
    } else { 
        const iconRect = this.iconEl.getBoundingClientRect(); 
        const screenRect = document.getElementById('phone-screen').getBoundingClientRect(); 
        const centerX = iconRect.left - screenRect.left + iconRect.width / 2; 
        const centerY = iconRect.top - screenRect.top + iconRect.height / 2; 
         
        this.appWindow.style.transformOrigin = centerX + 'px ' + centerY + 'px'; 
        this.appWindow.style.transform = 'scale(0.1)'; 
        this.appWindow.style.opacity = '0'; 
    } 
     
    setTimeout(function() { 
        self.appWindow.classList.add('hidden'); 
        document.getElementById('desktop').style.filter = 'blur(0px)'; 
         
        self.isCardMode = false; 
        self.currentTabIndex = 0; 
        self.pageStack = []; 
        self.isCardDragging = false; 
         
        self.appWindow.style.cssText = 'background-color:' + self.color + ';'; 
         
        const homeIndicator = self.appWindow.querySelector('.home-indicator'); 
        const tabBar = self.appWindow.querySelector('.app-tab-bar'); 
        const appContent = self.appWindow.querySelector('.app-content-page'); 
        const homeIndicatorArea = self.appWindow.querySelector('.home-indicator-area'); 
         
        if (homeIndicator) homeIndicator.style.display = ''; 
        if (tabBar) tabBar.style.display = ''; 
        if (appContent) appContent.style.pointerEvents = ''; 
        if (homeIndicatorArea) homeIndicatorArea.style.display = ''; 
         
        self.appWindow.ontouchstart = null; 
        self.appWindow.ontouchmove = null; 
        self.appWindow.ontouchend = null; 
        self.appWindow.onmousedown = null; 
        self.appWindow.onclick = null; 
         
    }, 300); 
};

const defaultLyrics = []; 
 
const MusicPlayerState = { 
    isPlaying: false, 
    currentSong: null, 
    currentTime: 0, 
    duration: 180, 
    progress: 0, 
    likedSongs: [], 
    playlists: [ 
        { id: 1, name: "我喜欢的音乐", cover: null, color: "#fb7299", songs: [] }, 
        { id: 2, name: "深夜电台", cover: null, color: "#667eea", songs: [] } 
    ], 
    playMode: 'list', 
    audio: null, 
    fakeInterval: null, 
    idleTimer: null, 
    idleTimeout: 60000, 
    songs: [] 
}; 
 
function injectMusicStyles() { 
    if (!document.getElementById('music-app-styles')) { 
        const style = document.createElement('style'); 
        style.id = 'music-app-styles'; 
        style.textContent = MusicAppCSS + MusicIslandCSS; 
        document.head.appendChild(style); 
    } 
} 
 
injectMusicStyles(); 
 
function initAudio() { 
    if (!MusicPlayerState.audio) { 
        MusicPlayerState.audio = new Audio(); 
        MusicPlayerState.audio.addEventListener('timeupdate', function() { 
            if (MusicPlayerState.audio.duration > 0) { 
                MusicPlayerState.currentTime = MusicPlayerState.audio.currentTime; 
                MusicPlayerState.duration = MusicPlayerState.audio.duration; 
                MusicPlayerState.progress = (MusicPlayerState.currentTime / MusicPlayerState.duration) * 100; 
                updateAllProgressBars(); 
                updateLyrics(); 
            } 
        }); 
        MusicPlayerState.audio.addEventListener('loadedmetadata', function() { 
            MusicPlayerState.duration = MusicPlayerState.audio.duration; 
        }); 
        MusicPlayerState.audio.addEventListener('ended', function() { 
            playNextSong(); 
        }); 
        MusicPlayerState.audio.addEventListener('play', function() { 
            MusicPlayerState.isPlaying = true; 
            resetIdleTimer(); 
            updateAllPlayButtons(); 
        }); 
        MusicPlayerState.audio.addEventListener('pause', function() { 
            MusicPlayerState.isPlaying = false; 
            startIdleTimer(); 
            updateAllPlayButtons(); 
        }); 
    } 
} 
 
function startIdleTimer() { 
    clearIdleTimer(); 
    MusicPlayerState.idleTimer = setTimeout(function() { 
        if (!MusicPlayerState.isPlaying && DynamicIsland.activeApp === musicApp) { 
            DynamicIsland.clearApp(); 
        } 
    }, MusicPlayerState.idleTimeout); 
} 
 
function clearIdleTimer() { 
    if (MusicPlayerState.idleTimer) { 
        clearTimeout(MusicPlayerState.idleTimer); 
        MusicPlayerState.idleTimer = null; 
    } 
} 
 
function resetIdleTimer() { 
    clearIdleTimer(); 
} 
 
function updateAllProgressBars() { 
    const appProgress = document.querySelector('.music-player-progress-fill'); 
    if (appProgress) { 
        appProgress.style.width = MusicPlayerState.progress + '%'; 
    } 
    const appTimeNow = document.querySelector('.music-player-time-now'); 
    if (appTimeNow) { 
        appTimeNow.textContent = formatTime(MusicPlayerState.currentTime); 
    } 
    const appTimeTotal = document.querySelector('.music-player-time-total'); 
    if (appTimeTotal) { 
        appTimeTotal.textContent = formatTime(MusicPlayerState.duration); 
    } 
    const islandProgress = document.querySelector('.island-music-progress-fill'); 
    if (islandProgress) { 
        islandProgress.style.width = MusicPlayerState.progress + '%'; 
    } 
} 
 
function updateAllPlayButtons() { 
    const icon = MusicPlayerState.isPlaying ? SVGIcons.pause : SVGIcons.play; 
    document.querySelectorAll('.play-toggle-btn').forEach(function(btn) { 
        btn.innerHTML = icon; 
    }); 
    document.querySelectorAll('.island-play-btn').forEach(function(btn) { 
        btn.innerHTML = icon; 
    }); 
    const waveEls = document.querySelectorAll('.island-music-quiet-wave'); 
    waveEls.forEach(function(el) { 
        if (MusicPlayerState.isPlaying) { 
            el.classList.add('playing'); 
        } else { 
            el.classList.remove('playing'); 
        } 
    }); 
} 
 
function updateLyrics() { 
    const song = MusicPlayerState.currentSong; 
    if (!song || !song.lyrics) return; 
     
    const currentTime = MusicPlayerState.currentTime; 
    let activeIndex = 0; 
     
    for (let i = 0; i < song.lyrics.length; i++) { 
        if (currentTime >= song.lyrics[i].time) { 
            activeIndex = i; 
        } 
    } 
     
    document.querySelectorAll('.music-lyric-line, .island-music-lyric-line').forEach(function(line, index) { 
        if (parseInt(line.dataset.index) === activeIndex) { 
            if (!line.classList.contains('active')) { 
                line.classList.add('active'); 
                line.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
            } 
        } else { 
            line.classList.remove('active'); 
        } 
    }); 
} 
 
function formatTime(seconds) { 
    if (!seconds || isNaN(seconds)) return '0:00'; 
    const mins = Math.floor(seconds / 60); 
    const secs = Math.floor(seconds % 60); 
    return mins + ':' + (secs < 10 ? '0' : '') + secs; 
} 
 
function playSong(song) { 
    initAudio(); 
     
    if (MusicPlayerState.fakeInterval) { 
        clearInterval(MusicPlayerState.fakeInterval); 
        MusicPlayerState.fakeInterval = null; 
    } 
     
    MusicPlayerState.currentSong = song; 
    MusicPlayerState.currentTime = 0; 
    MusicPlayerState.progress = 0; 
     
    if (song.url) { 
        MusicPlayerState.audio.src = song.url; 
        MusicPlayerState.audio.load(); 
        MusicPlayerState.audio.play().catch(function(e) { 
            console.log('播放失败:', e); 
        }); 
    } else { 
        MusicPlayerState.duration = 180; 
        MusicPlayerState.isPlaying = true; 
        startFakeProgress(); 
    } 
     
    musicApp.activateIsland(); 
} 
 
function startFakeProgress() { 
    if (MusicPlayerState.fakeInterval) { 
        clearInterval(MusicPlayerState.fakeInterval); 
    } 
    MusicPlayerState.fakeInterval = setInterval(function() { 
        if (MusicPlayerState.isPlaying && (!MusicPlayerState.currentSong || !MusicPlayerState.currentSong.url)) { 
            MusicPlayerState.currentTime += 1; 
            MusicPlayerState.progress = (MusicPlayerState.currentTime / MusicPlayerState.duration) * 100; 
            updateAllProgressBars(); 
            updateLyrics(); 
             
            if (MusicPlayerState.currentTime >= MusicPlayerState.duration) { 
                playNextSong(); 
            } 
        } 
    }, 1000); 
} 
 
function togglePlay() { 
    if (!MusicPlayerState.currentSong) return; 
     
    if (MusicPlayerState.currentSong.url && MusicPlayerState.audio) { 
        if (MusicPlayerState.isPlaying) { 
            MusicPlayerState.audio.pause(); 
        } else { 
            MusicPlayerState.audio.play().catch(function(e) { 
                console.log('播放失败:', e); 
            }); 
        } 
    } else { 
        MusicPlayerState.isPlaying = !MusicPlayerState.isPlaying; 
        if (MusicPlayerState.isPlaying) { 
            startFakeProgress(); 
            resetIdleTimer(); 
        } else { 
            startIdleTimer(); 
        } 
        updateAllPlayButtons(); 
    } 
} 
 
function playNextSong() { 
    const songs = MusicPlayerState.songs; 
    if (!songs.length) return; 
     
    let nextIndex = 0; 
    if (MusicPlayerState.currentSong) { 
        const currentIndex = songs.findIndex(s => s.id === MusicPlayerState.currentSong.id); 
        if (MusicPlayerState.playMode === 'repeat') { 
            nextIndex = currentIndex; 
        } else if (MusicPlayerState.playMode === 'shuffle') { 
            nextIndex = Math.floor(Math.random() * songs.length); 
        } else { 
            nextIndex = (currentIndex + 1) % songs.length; 
        } 
    } 
     
    if (songs[nextIndex]) { 
        playSong(songs[nextIndex]); 
        refreshPlayerPage(); 
    } 
} 
 
function playPrevSong() { 
    const songs = MusicPlayerState.songs; 
    if (!songs.length) return; 
     
    let prevIndex = 0; 
    if (MusicPlayerState.currentSong) { 
        const currentIndex = songs.findIndex(s => s.id === MusicPlayerState.currentSong.id); 
        prevIndex = (currentIndex - 1 + songs.length) % songs.length; 
    } 
     
    if (songs[prevIndex]) { 
        playSong(songs[prevIndex]); 
        refreshPlayerPage(); 
    } 
} 
 
function refreshPlayerPage() { 
    const playerPage = document.querySelector('.music-player-page'); 
    if (playerPage && MusicPlayerState.currentSong) { 
        const song = MusicPlayerState.currentSong; 
        const titleEl = playerPage.querySelector('.music-player-title'); 
        const artistEl = playerPage.querySelector('.music-player-artist'); 
        const coverEl = playerPage.querySelector('.music-player-cover'); 
        const lyricsContainer = playerPage.querySelector('.music-lyrics-container'); 
         
        if (titleEl) titleEl.textContent = song.title; 
        if (artistEl) artistEl.textContent = song.artist; 
        if (coverEl) { 
            coverEl.innerHTML = song.cover  
                ? '<img src="' + song.cover + '" alt="">' 
                : '<div class="music-player-cover-placeholder" style="background:linear-gradient(135deg,' + song.color + ',' + song.color + '99);">' + SVGIcons.music + '</div>'; 
        } 
        if (lyricsContainer) { 
            const lyrics = song.lyrics || defaultLyrics; 
            let lyricsHtml = ''; 
            lyrics.forEach(function(line, index) { 
                lyricsHtml += '<div class="music-lyric-line" data-index="' + index + '">' + line.text + '</div>'; 
            }); 
            lyricsContainer.innerHTML = lyricsHtml; 
        } 
         
        const likeBtn = playerPage.querySelector('.like-btn'); 
        if (likeBtn) { 
            if (isLiked(song.id)) { 
                likeBtn.classList.add('liked'); 
                likeBtn.querySelector('svg').outerHTML = SVGIcons.heart; 
            } else { 
                likeBtn.classList.remove('liked'); 
                likeBtn.querySelector('svg').outerHTML = SVGIcons.heartOutline; 
            } 
        } 
    } 
} 
 
function seekTo(percentage) { 
    MusicPlayerState.progress = percentage; 
    MusicPlayerState.currentTime = (percentage / 100) * MusicPlayerState.duration; 
     
    if (MusicPlayerState.audio && MusicPlayerState.currentSong && MusicPlayerState.currentSong.url) { 
        MusicPlayerState.audio.currentTime = MusicPlayerState.currentTime; 
    } 
     
    updateAllProgressBars(); 
} 
 
function toggleLike(songId) { 
    const index = MusicPlayerState.likedSongs.indexOf(songId); 
    if (index > -1) { 
        MusicPlayerState.likedSongs.splice(index, 1); 
    } else { 
        MusicPlayerState.likedSongs.push(songId); 
    } 
    updateLikeButtons(songId); 
} 
 
function isLiked(songId) { 
    return MusicPlayerState.likedSongs.indexOf(songId) > -1; 
} 
 
function updateLikeButtons(songId) { 
    document.querySelectorAll('.music-song-btn.like-btn[data-id="' + songId + '"]').forEach(function(btn) { 
        if (isLiked(songId)) { 
            btn.classList.add('liked'); 
        } else { 
            btn.classList.remove('liked'); 
        } 
    }); 
     
    document.querySelectorAll('.music-song-item[data-id="' + songId + '"]').forEach(function(item) { 
        const btn = item.querySelector('.like-btn'); 
        if (btn) { 
            if (isLiked(songId)) { 
                btn.classList.add('liked'); 
            } else { 
                btn.classList.remove('liked'); 
            } 
        } 
    }); 
} 
 
function extractColorFromImage(imgSrc, callback) { 
    const img = new Image(); 
    img.crossOrigin = 'Anonymous'; 
    img.onload = function() { 
        const canvas = document.createElement('canvas'); 
        const ctx = canvas.getContext('2d'); 
        canvas.width = 50; 
        canvas.height = 50; 
        ctx.drawImage(img, 0, 0, 50, 50); 
         
        try { 
            const imageData = ctx.getImageData(0, 0, 50, 50).data; 
            let r = 0, g = 0, b = 0, count = 0; 
             
            for (let i = 0; i < imageData.length; i += 4) { 
                const brightness = (imageData[i] + imageData[i + 1] + imageData[i + 2]) / 3; 
                if (brightness > 30 && brightness < 220) { 
                    r += imageData[i]; 
                    g += imageData[i + 1]; 
                    b += imageData[i + 2]; 
                    count++; 
                } 
            } 
             
            if (count > 0) { 
                r = Math.round(r / count); 
                g = Math.round(g / count); 
                b = Math.round(b / count); 
                const hex = '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1); 
                callback(hex); 
            } else { 
                callback('#fb7299'); 
            } 
        } catch (e) { 
            callback('#fb7299'); 
        } 
    }; 
    img.onerror = function() { 
        callback('#fb7299'); 
    }; 
    img.src = imgSrc; 
} 
 
function parseLrcFile(lrcText) { 
    const lines = lrcText.split('\n'); 
    const lyrics = []; 
    const timeRegex = /$$(\d{2}):(\d{2})\.(\d{2,3})$$/g; 
     
    lines.forEach(function(line) { 
        const matches = []; 
        let match; 
        while ((match = timeRegex.exec(line)) !== null) { 
            const minutes = parseInt(match[1]); 
            const seconds = parseInt(match[2]); 
            const ms = parseInt(match[3]); 
            const time = minutes * 60 + seconds + ms / (match[3].length === 3 ? 1000 : 100); 
            matches.push(time); 
        } 
         
        const text = line.replace(/$$\d{2}:\d{2}\.\d{2,3}$$/g, '').trim(); 
        if (text && matches.length > 0) { 
            matches.forEach(function(time) { 
                lyrics.push({ time: time, text: text }); 
            }); 
        } 
    }); 
     
    lyrics.sort(function(a, b) { return a.time - b.time; }); 
    return lyrics; 
} 
 
function addSongByUrl(url, title, artist, coverUrl, lrcText) { 
    const newSong = { 
        id: Date.now(), 
        title: title || '未知歌曲', 
        artist: artist || '未知艺术家', 
        cover: coverUrl || null, 
        color: '#fb7299', 
        url: url, 
        lyrics: lrcText ? parseLrcFile(lrcText) : defaultLyrics 
    }; 
     
    if (coverUrl) { 
        extractColorFromImage(coverUrl, function(color) { 
            newSong.color = color; 
            refreshSongList(); 
        }); 
    } 
     
    MusicPlayerState.songs.push(newSong); 
    refreshSongList(); 
    return newSong; 
}

function showModal(title, content, onConfirm, onCancel) { 
    const appWindow = musicApp.appWindow; 
    if (!appWindow) return; 
     
    const modal = document.createElement('div'); 
    modal.className = 'music-modal-overlay'; 
    modal.innerHTML = '<div class="music-modal">' + 
        '<div class="music-modal-handle"></div>' + 
        '<div class="music-modal-title">' + title + '</div>' + 
        content + 
    '</div>'; 
     
    appWindow.appendChild(modal); 
     
    const cancelBtn = modal.querySelector('.music-modal-btn-cancel'); 
    const confirmBtn = modal.querySelector('.music-modal-btn-confirm'); 
     
    if (cancelBtn) { 
        cancelBtn.onclick = function() { 
            modal.style.animation = 'modalFadeIn 0.2s ease reverse'; 
            modal.querySelector('.music-modal').style.animation = 'modalSlideUp 0.25s ease reverse'; 
            setTimeout(function() { modal.remove(); }, 200); 
            if (onCancel) onCancel(); 
        }; 
    } 
     
    if (confirmBtn) { 
        confirmBtn.onclick = function() { 
            if (onConfirm) { 
                const result = onConfirm(modal); 
                if (result !== false) { 
                    modal.style.animation = 'modalFadeIn 0.2s ease reverse'; 
                    modal.querySelector('.music-modal').style.animation = 'modalSlideUp 0.25s ease reverse'; 
                    setTimeout(function() { modal.remove(); }, 200); 
                } 
            } 
        }; 
    } 
     
    modal.onclick = function(e) { 
        if (e.target === modal) { 
            modal.style.animation = 'modalFadeIn 0.2s ease reverse'; 
            modal.querySelector('.music-modal').style.animation = 'modalSlideUp 0.25s ease reverse'; 
            setTimeout(function() { modal.remove(); }, 200); 
        } 
    }; 
     
    return modal; 
}

function bindPlaylistPageEvents(page, playlist) { 
    const songItems = page.querySelectorAll('.music-song-item'); 
    songItems.forEach(function(item) { 
        const songId = parseInt(item.dataset.id); 
        const song = MusicPlayerState.songs.find(s => s.id === songId); 
         
        item.onclick = function(e) { 
            if (e.target.closest('.like-btn')) { 
                e.stopPropagation(); 
                toggleLike(songId); 
                const likeBtn = item.querySelector('.like-btn'); 
                if (isLiked(songId)) { 
                    likeBtn.classList.add('liked'); 
                    likeBtn.innerHTML = SVGIcons.heart; 
                } else { 
                    likeBtn.classList.remove('liked'); 
                    likeBtn.innerHTML = SVGIcons.heartOutline; 
                } 
                return; 
            } 
             
            if (e.target.closest('.delete-btn')) { 
                e.stopPropagation(); 
                const index = playlist.songs.indexOf(songId); 
                if (index > -1) { 
                    playlist.songs.splice(index, 1); 
                    item.style.animation = 'fadeOut 0.3s ease'; 
                    setTimeout(function() { 
                        item.remove(); 
                        const countEl = page.querySelector('.music-playlist-detail-count'); 
                        if (countEl) { 
                            countEl.textContent = playlist.songs.length + ' 首歌曲'; 
                        } 
                        if (playlist.songs.length === 0) { 
                            const songList = page.querySelector('.music-song-list'); 
                            if (songList) { 
                                songList.innerHTML = '<div class="music-empty-state">' + 
                                    SVGIcons.music + 
                                    '<div class="music-empty-state-text">歌单还是空的</div>' + 
                                '</div>'; 
                            } 
                        } 
                    }, 300); 
                } 
                return; 
            } 
             
            if (song) { 
                playSong(song); 
                openPlayerPage(song); 
            } 
        }; 
    }); 
     
    const playAllBtn = page.querySelector('.play-all-btn'); 
    if (playAllBtn) { 
        playAllBtn.onclick = function(e) { 
            e.stopPropagation(); 
            if (playlist.songs.length > 0) { 
                const firstSongId = playlist.songs[0]; 
                const firstSong = MusicPlayerState.songs.find(s => s.id === firstSongId); 
                if (firstSong) { 
                    playSong(firstSong); 
                    openPlayerPage(firstSong); 
                } 
            } 
        }; 
    } 
     
    const editBtn = page.querySelector('.edit-playlist-btn'); 
    if (editBtn) { 
        editBtn.onclick = function(e) { 
            e.stopPropagation(); 
            showEditPlaylistModal(playlist, page); 
        }; 
    } 
     
    const addSongsBtn = page.querySelector('.add-songs-to-playlist'); 
    if (addSongsBtn) { 
        addSongsBtn.onclick = function(e) { 
            e.stopPropagation(); 
            showAddSongsToPlaylistModal(playlist, page); 
        }; 
    } 
}

            '<div class="music-menu-arrow" style="color:#fb7299;">' + checkIcon + '</div>' + 
        '</div>'; 
    }); 
     
    const content = '<div style="max-height:300px;overflow-y:auto;">' + 
        '<div class="music-menu-list" style="padding:0;">' + songsHtml + '</div>' + 
        '</div>' + 
        '<div class="music-modal-btns">' + 
            '<button class="music-modal-btn music-modal-btn-confirm" style="flex:1;">完成</button>' + 
        '</div>'; 
     
    const modal = showModal('添加歌曲', content, function() { 
        const songList = page.querySelector('.music-song-list'); 
        if (songList) { 
            let newSongsHtml = ''; 
            if (playlist.songs.length === 0) { 
                newSongsHtml = '<div class="music-empty-state">' + 
                    SVGIcons.music + 
                    '<div class="music-empty-state-text">歌单还是空的</div>' + 
                '</div>'; 
            } else { 
                playlist.songs.forEach(function(songId) { 
                    const song = MusicPlayerState.songs.find(s => s.id === songId); 
                    if (song) { 
                        newSongsHtml += generateSongItemHtml(song, true, playlist.id); 
                    } 
                }); 
            } 
            songList.innerHTML = newSongsHtml; 
            bindPlaylistPageEvents(page, playlist); 
        } 
         
        const countEl = page.querySelector('.music-playlist-detail-count'); 
        if (countEl) { 
            countEl.textContent = playlist.songs.length + ' 首歌曲'; 
        } 
         
        return true; 
    }); 
     
    if (modal) { 
        modal.querySelectorAll('.song-select-item').forEach(function(item) { 
            item.onclick = function() { 
                const songId = parseInt(item.dataset.songId); 
                const inPlaylist = item.dataset.inPlaylist === 'true'; 
                 
                if (inPlaylist) { 
                    const index = playlist.songs.indexOf(songId); 
                    if (index > -1) { 
                        playlist.songs.splice(index, 1); 
                    } 
                    item.dataset.inPlaylist = 'false'; 
                    item.querySelector('.music-menu-arrow').innerHTML = ''; 
                } else { 
                    playlist.songs.push(songId); 
                    item.dataset.inPlaylist = 'true'; 
                    item.querySelector('.music-menu-arrow').innerHTML = SVGIcons.check; 
                } 
            }; 
        }); 
    } 
} 
 
function openPlayerPage(song) { 
    const playerHtml = generatePlayerPageHtml(song); 
    const page = musicApp.openDetailPage(playerHtml, { enableHomeIndicator: true, background: '#fff' }); 
     
    if (page) { 
        bindPlayerPageEvents(page, song); 
    } 
} 
 
function bindPlayerPageEvents(page, song) { 
    const playToggleBtn = page.querySelector('.play-toggle-btn'); 
    if (playToggleBtn) { 
        playToggleBtn.onclick = function(e) { 
            e.stopPropagation(); 
            togglePlay(); 
        }; 
    } 
     
    const prevBtn = page.querySelector('.prev-btn'); 
    if (prevBtn) { 
        prevBtn.onclick = function(e) { 
            e.stopPropagation(); 
            playPrevSong(); 
        }; 
    } 
     
    const nextBtn = page.querySelector('.next-btn'); 
    if (nextBtn) { 
        nextBtn.onclick = function(e) { 
            e.stopPropagation(); 
            playNextSong(); 
        }; 
    } 
     
    const likeBtn = page.querySelector('.like-btn'); 
    if (likeBtn) { 
        likeBtn.onclick = function(e) { 
            e.stopPropagation(); 
            const songId = parseInt(likeBtn.dataset.id); 
            toggleLike(songId); 
            if (isLiked(songId)) { 
                likeBtn.classList.add('liked'); 
                likeBtn.querySelector('svg').outerHTML = SVGIcons.heart; 
            } else { 
                likeBtn.classList.remove('liked'); 
                likeBtn.querySelector('svg').outerHTML = SVGIcons.heartOutline; 
            } 
        }; 
    } 
     
    const addToPlaylistBtn = page.querySelector('.add-to-playlist-btn'); 
    if (addToPlaylistBtn) { 
        addToPlaylistBtn.onclick = function(e) { 
            e.stopPropagation(); 
            const songId = parseInt(addToPlaylistBtn.dataset.id); 
            showAddToPlaylistModal(songId); 
        }; 
    } 
     
    const progressBar = page.querySelector('.music-player-progress-bar'); 
    if (progressBar) { 
        progressBar.onclick = function(e) { 
            e.stopPropagation(); 
            const rect = progressBar.getBoundingClientRect(); 
            const percentage = ((e.clientX - rect.left) / rect.width) * 100; 
            seekTo(Math.max(0, Math.min(100, percentage))); 
        }; 
    } 
} 
 
function openLikedSongsPage() { 
    let songsHtml = ''; 
    if (MusicPlayerState.likedSongs.length === 0) { 
        songsHtml = '<div class="music-empty-state">' + 
            SVGIcons.heartOutline + 
            '<div class="music-empty-state-text">还没有喜欢的歌曲</div>' + 
        '</div>'; 
    } else { 
        MusicPlayerState.likedSongs.forEach(function(songId) { 
            const song = MusicPlayerState.songs.find(s => s.id === songId); 
            if (song) { 
                songsHtml += generateSongItemHtml(song); 
            } 
        }); 
    } 
     
    const pageHtml = '<div class="music-app-container" style="min-height:100%;">' + 
        '<div class="music-section" style="padding-top:10px;">' + 
            '<div class="music-section-header">' + 
                '<div class="music-section-title">我喜欢的音乐</div>' + 
            '</div>' + 
            '<div class="music-song-list liked-songs-list">' + songsHtml + '</div>' + 
        '</div>' + 
    '</div>'; 
     
    const page = musicApp.openDetailPage(pageHtml, { enableHomeIndicator: true, background: '#fff5f8' }); 
     
    if (page) { 
        bindLikedSongsPageEvents(page); 
    } 
} 
 
function bindLikedSongsPageEvents(page) { 
    const songItems = page.querySelectorAll('.music-song-item'); 
    songItems.forEach(function(item) { 
        const songId = parseInt(item.dataset.id); 
        const song = MusicPlayerState.songs.find(s => s.id === songId); 
         
        item.onclick = function(e) { 
            if (e.target.closest('.like-btn')) { 
                e.stopPropagation(); 
                toggleLike(songId); 
                item.style.animation = 'fadeOut 0.3s ease'; 
                setTimeout(function() { 
                    item.remove(); 
                    if (MusicPlayerState.likedSongs.length === 0) { 
                        const listEl = page.querySelector('.liked-songs-list'); 
                        if (listEl) { 
                            listEl.innerHTML = '<div class="music-empty-state">' + 
                                SVGIcons.heartOutline + 
                                '<div class="music-empty-state-text">还没有喜欢的歌曲</div>' + 
                            '</div>'; 
                        } 
                    } 
                }, 300); 
                return; 
            } 
             
            if (song) { 
                playSong(song); 
                openPlayerPage(song); 
            } 
        }; 
    }); 
} 
 
function bindMainTabEvents(container) { 
    const songItems = container.querySelectorAll('.music-song-item'); 
    songItems.forEach(function(item) { 
        const songId = parseInt(item.dataset.id); 
        const song = MusicPlayerState.songs.find(s => s.id === songId); 
         
        item.onclick = function(e) { 
            if (e.target.closest('.like-btn')) { 
                e.stopPropagation(); 
                toggleLike(songId); 
                const likeBtn = item.querySelector('.like-btn'); 
                if (isLiked(songId)) { 
                    likeBtn.classList.add('liked'); 
                    likeBtn.innerHTML = SVGIcons.heart; 
                } else { 
                    likeBtn.classList.remove('liked'); 
                    likeBtn.innerHTML = SVGIcons.heartOutline; 
                } 
                return; 
            } 
             
            if (song) { 
                playSong(song); 
                openPlayerPage(song); 
            } 
        }; 
    }); 
     
    const addSongBtn = container.querySelector('.add-song-btn'); 
    if (addSongBtn) { 
        addSongBtn.onclick = function(e) { 
            e.stopPropagation(); 
            showAddSongModal(); 
        }; 
    } 
     
    const createPlaylistCard = container.querySelector('.create-playlist-card'); 
    if (createPlaylistCard) { 
        createPlaylistCard.onclick = function(e) { 
            e.stopPropagation(); 
            showCreatePlaylistModal(); 
        }; 
    } 
     
    const playlistCards = container.querySelectorAll('.music-playlist-card:not(.create-playlist-card)'); 
    playlistCards.forEach(function(card) { 
        card.onclick = function(e) { 
            e.stopPropagation(); 
            const playlistId = parseInt(card.dataset.id); 
            const playlist = MusicPlayerState.playlists.find(p => p.id === playlistId); 
            if (playlist) { 
                openPlaylistPage(playlist); 
            } 
        }; 
    }); 
} 
 
function bindMeTabEvents(container) { 
    const likedSongsMenu = container.querySelector('.liked-songs-menu'); 
    if (likedSongsMenu) { 
        likedSongsMenu.onclick = function(e) { 
            e.stopPropagation(); 
            openLikedSongsPage(); 
        }; 
    } 
} 
 
const musicApp = new MyBaseApp({ 
    id: 'music-app', 
    name: '音乐', 
    color: '#fff5f8', 
    barStyle: 'dark', 
    detailPageHomeIndicatorEnabled: true, 
     
    tabs: [ 
        {  
            name: '首页',  
            icon: SVGIcons.home,  
            content: generateRecommendTabContent() 
        }, 
        {  
            name: '发现',  
            icon: SVGIcons.search,  
            content: generateDiscoverTabContent() 
        }, 
        {  
            name: '我的',  
            icon: SVGIcons.user,  
            content: generateMeTabContent() 
        } 
    ], 
     
    island: { 
        state: MusicPlayerState, 
         
        render: function(mode, state, app) { 
            if (!state.currentSong) return ''; 
             
            const song = state.currentSong; 
             
            if (mode === 'quiet') { 
                const coverHtml = song.cover  
                    ? '<img src="' + song.cover + '" alt="">'  
                    : '<div class="island-music-quiet-cover-placeholder" style="background:linear-gradient(135deg,' + song.color + ',' + song.color + '99);">' + SVGIcons.music + '</div>'; 
                const waveClass = state.isPlaying ? 'playing' : ''; 
                 
                return '<div class="island-music-quiet">' + 
                    '<div class="island-music-quiet-cover">' + coverHtml + '</div>' + 
                    '<div class="island-music-quiet-wave ' + waveClass + '">' + 
                        '<span></span><span></span><span></span>' + 
                    '</div>' + 
                '</div>'; 
            } 
             
            if (mode === 'medium') { 
                const coverHtml = song.cover  
                    ? '<img src="' + song.cover + '" alt="">'  
                    : '<div class="island-music-cover-placeholder" style="background:linear-gradient(135deg,' + song.color + ',' + song.color + '99);">' + SVGIcons.music + '</div>'; 
                const liked = isLiked(song.id); 
                const likeIcon = liked ? SVGIcons.heart : SVGIcons.heartOutline; 
                const likedClass = liked ? 'liked' : ''; 
                 
                return '<div class="island-music-medium">' + 
                    '<div class="island-music-header">' + 
                        '<div class="island-music-cover">' + coverHtml + '</div>' + 
                        '<div class="island-music-info">' + 
                            '<div class="island-music-title">' + song.title + '</div>' + 
                            '<div class="island-music-artist">' + song.artist + '</div>' + 
                        '</div>' + 
                    '</div>' + 
                    '<div class="island-music-progress">' + 
                        '<div class="island-music-progress-bar">' + 
                            '<div class="island-music-progress-fill" style="width:' + state.progress + '%;"></div>' + 
                        '</div>' + 
                    '</div>' + 
                    '<div class="island-music-controls">' + 
                        '<div class="island-music-side-btns">' + 
                            '<div class="island-music-btn island-like-btn ' + likedClass + '" data-id="' + song.id + '">' + likeIcon + '</div>' + 
                        '</div>' + 
                        '<div class="island-music-main-btns">' + 
                            '<div class="island-music-btn island-music-btn-skip island-prev-btn">' + SVGIcons.prev + '</div>' + 
                            '<div class="island-music-btn island-play-btn">' + (state.isPlaying ? SVGIcons.pause : SVGIcons.play) + '</div>' + 
                            '<div class="island-music-btn island-music-btn-skip island-next-btn">' + SVGIcons.next + '</div>' + 
                        '</div>' + 
                    '</div>' + 
                '</div>'; 
            } 
             
            if (mode === 'large') { 
                const coverHtml = song.cover  
                    ? '<img src="' + song.cover + '" alt="">'  
                    : '<div class="island-music-large-cover-placeholder" style="background:linear-gradient(135deg,' + song.color + ',' + song.color + '99);">' + SVGIcons.music + '</div>'; 
                const liked = isLiked(song.id); 
                const likeIcon = liked ? SVGIcons.heart : SVGIcons.heartOutline; 
                const likedClass = liked ? 'liked' : ''; 
                 
                const lyrics = song.lyrics || defaultLyrics; 
                let lyricsHtml = ''; 
                let activeIndex = 0; 
                for (let i = 0; i < lyrics.length; i++) { 
                    if (state.currentTime >= lyrics[i].time) { 
                        activeIndex = i; 
                    } 
                } 
                lyrics.forEach(function(line, index) { 
                    const activeClass = index === activeIndex ? 'active' : ''; 
                    lyricsHtml += '<div class="island-music-lyric-line ' + activeClass + '" data-index="' + index + '">' + line.text + '</div>'; 
                }); 
                 
                return '<div class="island-music-large">' + 
                    '<div class="island-music-large-header">' + 
                        '<div class="island-music-large-cover">' + coverHtml + '</div>' + 
                        '<div class="island-music-large-info">' + 
                            '<div class="island-music-large-title">' + song.title + '</div>' + 
                            '<div class="island-music-large-artist">' + song.artist + '</div>' + 
                        '</div>' + 
                        '<div class="island-music-btn island-like-btn ' + likedClass + '" data-id="' + song.id + '">' + likeIcon + '</div>' + 
                    '</div>' + 
                    '<div class="island-music-progress">' + 
                        '<div class="island-music-progress-bar">' + 
                            '<div class="island-music-progress-fill" style="width:' + state.progress + '%;"></div>' + 
                        '</div>' + 
                    '</div>' + 
                    '<div class="island-music-large-controls">' + 
                        '<div class="island-music-large-btn island-prev-btn">' + SVGIcons.prev + '</div>' + 
                        '<div class="island-music-large-btn island-music-large-btn-main island-play-btn">' + (state.isPlaying ? SVGIcons.pause : SVGIcons.play) + '</div>' + 
                        '<div class="island-music-large-btn island-next-btn">' + SVGIcons.next + '</div>' + 
                    '</div>' + 
                    '<div class="island-music-lyrics">' + lyricsHtml + '</div>' + 
                '</div>'; 
            } 
             
            return ''; 
        }, 
         
        bindEvents: function(container, state, app) { 
            const playBtns = container.querySelectorAll('.island-play-btn'); 
            playBtns.forEach(function(btn) { 
                btn.onclick = function(e) { 
                    e.stopPropagation(); 
                    togglePlay(); 
                }; 
            }); 
             
            const prevBtns = container.querySelectorAll('.island-prev-btn'); 
            prevBtns.forEach(function(btn) { 
                btn.onclick = function(e) { 
                    e.stopPropagation(); 
                    playPrevSong(); 
                }; 
            }); 
             
            const nextBtns = container.querySelectorAll('.island-next-btn'); 
            nextBtns.forEach(function(btn) { 
                btn.onclick = function(e) { 
                    e.stopPropagation(); 
                    playNextSong(); 
                }; 
            }); 
             
            const likeBtns = container.querySelectorAll('.island-like-btn'); 
            likeBtns.forEach(function(btn) { 
                btn.onclick = function(e) { 
                    e.stopPropagation(); 
                    const songId = parseInt(btn.dataset.id); 
                    toggleLike(songId); 
                    if (isLiked(songId)) { 
                        btn.classList.add('liked'); 
                        btn.innerHTML = SVGIcons.heart; 
                    } else { 
                        btn.classList.remove('liked'); 
                        btn.innerHTML = SVGIcons.heartOutline; 
                    } 
                }; 
            }); 
             
            const progressBars = container.querySelectorAll('.island-music-progress-bar'); 
            progressBars.forEach(function(bar) { 
                bar.onclick = function(e) { 
                    e.stopPropagation(); 
                    const rect = bar.getBoundingClientRect(); 
                    const percentage = ((e.clientX - rect.left) / rect.width) * 100; 
                    seekTo(Math.max(0, Math.min(100, percentage))); 
                }; 
            }); 
        }, 
         
        onAppReady: function(win, app) { 
            const contentArea = win.querySelector('#main-content-area'); 
            if (contentArea) { 
                bindMainTabEvents(contentArea); 
            } 
        }, 
         
        onTabChange: function(contentArea, app) { 
            if (app.currentTabIndex === 0) { 
                contentArea.innerHTML = generateRecommendTabContent(); 
                bindMainTabEvents(contentArea); 
            } else if (app.currentTabIndex === 1) { 
                contentArea.innerHTML = generateDiscoverTabContent(); 
            } else if (app.currentTabIndex === 2) { 
                contentArea.innerHTML = generateMeTabContent(); 
                bindMeTabEvents(contentArea); 
            } 
        } 
    } 
}); 
 
initAudio();

fadeOutStyle.textContent = '@keyframes fadeOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-20px); } }'; 
document.head.appendChild(fadeOutStyle); 
</script>
